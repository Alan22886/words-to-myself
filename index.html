<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><title>给自己的话</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body><main><div id="date"></div><form id="loginForm" hidden><label class="sr" for="email">邮箱</label><input id="email" type="email" placeholder="邮箱" autocomplete="username" required><label class="sr" for="password">密码</label><input id="password" type="password" placeholder="密码" autocomplete="current-password" required><button id="login" type="submit">登录</button></form><div id="page"><article id="reading"></article><section id="editing" hidden><label class="sr" for="title">标题</label><input id="title" maxlength="100" placeholder="标题"><div class="toolbar" aria-label="文字格式"><button data-command="bold"><b>粗体</b></button><button data-command="italic"><i>斜体</i></button><button data-command="insertUnorderedList">列表</button><button data-command="formatBlock" data-value="h2">小标题</button><button data-command="removeFormat">清除格式</button><label class="image-button">图片<input id="image" type="file" accept="image/jpeg,image/png,image/webp" hidden></label></div><div id="editor" contenteditable="true" role="textbox" aria-label="正文" aria-multiline="true" data-placeholder="写下想记住的话"></div></section><footer><button id="edit">编辑</button><button id="save" hidden>保存</button><button id="clear" hidden>清空</button></footer></div><span id="status" class="sr" role="status"></span><p id="notice" role="alert"></p></main><script type="module" src="app.js"></script></body></html>
